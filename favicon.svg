<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Frame -->
  <rect x="10" y="15" width="44" height="34" rx="6" fill="none" stroke="url(#mdGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Letter 'M' -->
  <path d="M16 41 V23 L23 31 L30 23 V41" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Down Arrow -->
  <path d="M43 25 V39 M38 34 L43 39 L48 34" fill="none" stroke="url(#mdGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
